name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository suite
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rokit
        run: |
          curl --fail --location --silent --show-error https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip --output "$RUNNER_TEMP/rokit.zip"
          echo "951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0  $RUNNER_TEMP/rokit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rokit.zip" -d "$RUNNER_TEMP/rokit"
          "$RUNNER_TEMP/rokit/rokit" self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GH_TOKEN" --skip-verify
          trap 'rokit authenticate github --remove' EXIT
          rokit install --no-trust-check
          rokit authenticate github --remove
          trap - EXIT
          unset GH_TOKEN
      - name: Install SDK types
        run: lute setup
      - name: Run repository gate
        run: lute run tools/gate.luau
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-evidence
          path: .lute/tmp/compose-gate/
          if-no-files-found: ignore
          retention-days: 7

  paired-perf:
    name: Paired performance (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rokit
        run: |
          curl --fail --location --silent --show-error https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip --output "$RUNNER_TEMP/rokit.zip"
          echo "951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0  $RUNNER_TEMP/rokit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rokit.zip" -d "$RUNNER_TEMP/rokit"
          "$RUNNER_TEMP/rokit/rokit" self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GH_TOKEN" --skip-verify
          trap 'rokit authenticate github --remove' EXIT
          rokit install --no-trust-check
          rokit authenticate github --remove
          trap - EXIT
          unset GH_TOKEN
      - name: Prepare measurement dependencies
        run: |
          lute setup
          lute run tools/sync-dependencies.luau
      - name: Resolve comparison base
        id: comparison-base
        env:
          COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          base_sha=$(git rev-parse --verify "$COMPARE_BASE^{commit}")
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare comparison base with common measurements
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/performance-base" "$BASE_SHA"
          mkdir -p build/performance
          git archive HEAD bench tools tests dependencies.lock.luau > build/performance/measurement.tar
          tar -xf build/performance/measurement.tar -C "$RUNNER_TEMP/performance-base"
          git -C "$RUNNER_TEMP/performance-base" diff --exit-code HEAD -- src authoring
          sha256sum build/performance/measurement.tar
          (cd "$RUNNER_TEMP/performance-base" && lute setup && lute run tools/sync-dependencies.luau)
      - name: Run counterbalanced paired performance
        env:
          SHARD: ${{ matrix.shard }}/6
        run: lute run bench/run-paired.luau "$RUNNER_TEMP/performance-base" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/performance" "" "$SHARD"
      - name: Retain paired performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-evidence-shard${{ matrix.shard }}
          path: build/performance/
          if-no-files-found: ignore
          retention-days: 7

  publish-performance:
    name: Publish performance
    needs: [paired-perf]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.paired-perf.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-performance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install Rokit
        run: |
          curl --fail --location --silent --show-error https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip --output "$RUNNER_TEMP/rokit.zip"
          echo "951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0  $RUNNER_TEMP/rokit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rokit.zip" -d "$RUNNER_TEMP/rokit"
          "$RUNNER_TEMP/rokit/rokit" self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GH_TOKEN" --skip-verify
          trap 'rokit authenticate github --remove' EXIT
          rokit install --no-trust-check
          rokit authenticate github --remove
          trap - EXIT
          unset GH_TOKEN
          lute setup
          lute run tools/sync-dependencies.luau
      - name: Collect the candidate measurements
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: performance-evidence-shard*
          path: ${{ runner.temp }}/evidence
      - name: Publish to the perf-results branch
        run: |
          set -euo pipefail
          stored=()
          for shard in "$RUNNER_TEMP"/evidence/*; do
            latest=$(ls -d "$shard"/candidate-* 2>/dev/null | sort -t- -k2 -n | tail -1 || true)
            if [ -n "$latest" ] && [ -f "$latest/stored.json" ]; then
              stored+=("$latest/stored.json")
            fi
          done
          if [ "${#stored[@]}" -eq 0 ]; then
            echo "No candidate measurements to publish."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin perf-results 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/results" origin/perf-results
            git -C "$RUNNER_TEMP/results" checkout -B perf-results
          else
            git worktree add --detach "$RUNNER_TEMP/results"
            git -C "$RUNNER_TEMP/results" checkout --orphan perf-results
            git -C "$RUNNER_TEMP/results" rm -rf --quiet .
          fi
          lute run bench/publish.luau "$RUNNER_TEMP/results" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H%M%SZ)" "${stored[@]}"
          cat "$RUNNER_TEMP/results/README.md" >> "$GITHUB_STEP_SUMMARY"
          git -C "$RUNNER_TEMP/results" add -A
          git -C "$RUNNER_TEMP/results" commit --quiet -m "Performance for $GITHUB_SHA"
          git -C "$RUNNER_TEMP/results" push origin perf-results

  gate:
    name: Gate
    needs: [repository, paired-perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          SUITE_RESULT: ${{ needs.repository.result }}
          PERFORMANCE_RESULT: ${{ needs.paired-perf.result }}
        run: |
          test "$SUITE_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
